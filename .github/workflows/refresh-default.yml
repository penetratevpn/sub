name: 'Refresh default subscription'
on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

concurrency:
  group: refresh-default
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: '1'
      SUBS_SECRET: ${{ secrets.VPN_SUBS }}
      HWID_SECRET: ${{ secrets.VPN_HWID }}
      SINGBOX_VERSION: '1.13.3'
      THREADS: '4'
      TIMEOUT: '8'
      REMARK_FORMAT: '{flag} {country}{index_suffix}'
      REMARK_LANGUAGE: 'ru'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install sing-box
        run: |
          curl -fsSL -o sing-box.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-linux-amd64.tar.gz"
          mkdir -p sing-box-bin
          tar -xzf sing-box.tar.gz -C sing-box-bin --strip-components=1
          chmod +x sing-box-bin/sing-box
          ./sing-box-bin/sing-box version

      - name: Validate required secrets
        run: |
          test -n "$SUBS_SECRET" || { echo 'VPN_SUBS secret is missing'; exit 1; }

      - name: Prepare private subscriptions file
        run: |
          umask 077
          printf '%s\n' "$SUBS_SECRET" > subs.private.txt

      - name: Refresh default file
        run: |
          if [ -n "$HWID_SECRET" ]; then
            python update_default.py \
              --default default \
              --subs subs.private.txt \
              --hwid "$HWID_SECRET" \
              --sing-box ./sing-box-bin/sing-box \
              --download-geoip \
              --threads "$THREADS" \
              --timeout "$TIMEOUT" \
              --remark-format "$REMARK_FORMAT" \
              --remark-language "$REMARK_LANGUAGE"
          else
            python update_default.py \
              --default default \
              --subs subs.private.txt \
              --sing-box ./sing-box-bin/sing-box \
              --download-geoip \
              --threads "$THREADS" \
              --timeout "$TIMEOUT" \
              --remark-format "$REMARK_FORMAT" \
              --remark-language "$REMARK_LANGUAGE"
          fi

      - name: Replace Chrome fingerprints with Firefox
        run: |
          python - <<'PY'
          import urllib.parse

          def replace_fingerprint(line):
              line = line.rstrip('\n\r')
              if not line.startswith('vless://'):
                  return line + '\n'
              try:
                  parsed = urllib.parse.urlparse(line)
                  params = urllib.parse.parse_qs(parsed.query, keep_blank_values=True)
                  params['fp'] = ['firefox']
                  new_query = urllib.parse.urlencode(params, doseq=True)
                  new_parsed = parsed._replace(query=new_query)
                  return urllib.parse.urlunparse(new_parsed) + '\n'
              except Exception:
                  return line + '\n'

          try:
              with open('default', 'r', encoding='utf-8') as f:
                  lines = f.readlines()
          except FileNotFoundError:
              exit(0)

          processed_lines = [replace_fingerprint(line) for line in lines]

          with open('default', 'w', encoding='utf-8') as f:
              f.writelines(processed_lines)

          modified = sum(1 for i in range(len(lines)) if lines[i] != processed_lines[i])
          if modified > 0:
              print(f"Replaced fingerprints in {modified} VLESS URLs")
          PY

      - name: Commit updated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          changed=false

          if ! git diff --quiet -- default; then
            git add default
            changed=true
          fi

          if ! git diff --quiet -- unstable; then
            git add unstable
            changed=true
          fi

          if [ "$changed" = true ]; then
            git commit -m 'chore: refresh default and unstable subscriptions'
            git push
          else
            echo 'No changes to commit'
          fi
